case:
  name: conduction_square
  type: steady_conduction

mesh:
  file: mesh/conduction_square_32x32.msh

domain:
  type: solid
  zone: surface_body

physics:
  energy: true

material:
  name: conduction_solid
  density: 1000.0
  specific_heat: 1000.0
  thermal_conductivity: 1.0

boundary_conditions:
  hot:
    zone: wall_hot
    type: temperature
    value: 400.0

  cold:
    zone: wall_cold
    type: temperature
    value: 300.0

  top:
    zone: wall_adiabatic_top
    type: heat_flux
    value: 0.0

  bottom:
    zone: wall_adiabatic_bottom
    type: heat_flux
    value: 0.0

validation:
  type: linear_conduction
  axis: x
  start_coordinate: -0.5
  end_coordinate: 0.5
  start_boundary: cold
  end_boundary: hot
  tolerance: 0.1

solver:
  initialization: standard
  initial_temperature: 350.0
  max_iterations: 200
  residual_target: 1.0e-8
